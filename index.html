<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/gif" href="designer/images/sprites/tamo_idle.gif" />
  <link rel="stylesheet" href="designer/style.css">
<script src="designer/scripts/lib/jszip.min.js"></script>
  <!-- <script src="designer/scripts/lib/p5.min.js"></script> -->
  <!-- <script src="designer/scripts/lib/p5.webserial.js"></script> -->
  <script src="designer/scripts/lib/CanvasToBMP.js"></script>
  <script src="designer/scripts/lib/gifuct-browser.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gif.js/dist/gif.js"></script>
  <script src="designer/scripts/spriteLoader.js"></script>
  <script src="designer/scripts/render.js"></script>
  <script src="designer/scripts/upload.js"></script>
  <script src="designer/scripts/download.js"></script>
  <script src="designer/scripts/bytes.js"></script>
  <script src="designer/scripts/sprite.js"></script>
  <script src="designer/scripts/undo.js"></script>
  <script src="designer/scripts/frameEditing.js"></script>
  <script src="designer/scripts/pixelEditing.js"></script>
  <script src="designer/scripts/defaultSprites.js"></script>
  <script src = "designer/scripts/buildCylinder.js" defer></script>
  <!-- <script src="designer/scripts/main.js" defer></script> -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tamo</title>
</head>

<body>
    <!-- {/* title image, gifs */} -->
    <div id="title_container" style = "margin-top:80px;">
        <div id="title_gif" class="transparent_img_drop_shadow title_image"></div>
        <div id = "tamo_gif" class = "title_image"></div>
        <div id = "porcini_gif" class = "title_image"></div>
        <div id = "bug_gif" class = "title_image"></div>
        <div id = "boto_gif" class = "title_image"></div>
    </div>
    <div id = "main_menu">
        <!-- experimenting w cylinder idea! -->
        <div class="scene" id = "cylinder_container">
            <div class="foreground">
                <img id = "main_menu_hardware_gif" src= "designer/images/icons/tamo_rotate_optimized_cropped.gif">
            </div>
        </div>
        <div id = "manual_button" class = "main_menu_button" style = "color:red;">
            //user guide
        </div>
        <div id = "designer_controls">
            <a href = "designer.html" class = "main_menu_button">//design a sprite</a>
            <img src="manual/images/xray_alpha.png" id="xray_image">
        </div>
        <div id = "set_identity_controls">
            <div class="main_menu_button">//change identity</div>
            <div id = "sprite_gif_holder">
                <img class = "sprite_gif" id = "TAMO_identity" style = "--x:-60px;--y:-40px;" src = "designer/images/preview_sprites/tamo.gif" onclick = "setUploadIdentity('TAMO')">
                <img class = "sprite_gif" id = "PORCINI_identity" style = "--x:-80px;--y:20px;" src = "designer/images/preview_sprites/porcini.gif" onclick = "setUploadIdentity('PORCINI')">
                <img class = "sprite_gif" id = "BUG_identity" style = "--x:-50px;--y:80px;" src = "designer/images/preview_sprites/bug.gif" onclick = "setUploadIdentity('BUG')">
                <img class = "sprite_gif" id = "BOTO_identity" style = "--x:10px;--y:120px;" src = "designer/images/preview_sprites/boto.gif" onclick = "setUploadIdentity('BOTO')">
                <img class = "sprite_gif" id = "CUSTOM_SPRITE_identity" style = "--x:80px;--y:120px;" src = "designer/images/preview_sprites/custom.gif" onclick = "setUploadIdentity('CUSTOM_SPRITE')">
                <img class = "sprite_gif" id = "NO_IDENTITY_identity" style = "--x:130px;--y:80px;" src = "designer/images/preview_sprites/egg.gif" onclick = "setUploadIdentity('NO_IDENTITY')">
            </div>
            <!-- <div class="button" onclick="writeTamoIdentity()">upload</div> -->
        </div>
        <div id = "set_mode_controls">
            <div class="main_menu_button">//change mode</div>
            <div>
                <div>normal</div>
                <div>video</div>
                <div class="button" onclick="writeTamoIdentity()">upload</div>
            </div>
        </div>
    </div>
</body>
</html>
